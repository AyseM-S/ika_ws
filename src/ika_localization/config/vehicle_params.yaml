# ============================================================
# TEK DOGRULUK KAYNAGI
# VARSAYIM olarak isaretli degerler mekanik veri gelince duzeltilecek
# ============================================================
wheel_odom_node:
  ros__parameters:
    wheel_radius: 0.065        # BILINIYOR (mekanik DDR): 130mm dis cap / 2
    track_width: 0.40          # *** VARSAYIM *** - 300mm govde yaricapina gore makul tahmin
    encoder_ppr: 400            # *** VARSAYIM *** - tipik planet reduktorlu DC motor icin
    publish_rate_hz: 30.0

nav2_params_common:
  ros__parameters:
    robot_radius: 0.3          # BILINIYOR (mekanik DDR): R=300mm emniyet cemberi
    vehicle_mass_kg: 10.0        # SARTNAME limiti (mekanik belgedeki 25kg DEGIL - o netlesmedi)
    max_climb_angle_deg: 12.0    # BILINIYOR (mekanik DDR): "govde egimini 12 altinda tutarak"
